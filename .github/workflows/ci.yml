name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Render + HTML validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generated page is up to date
        run: |
          node scripts/render.mjs
          git diff --exit-code -- index.html sitemap.xml || { echo "::error::index.html is stale: run 'npm run render' and commit."; exit 1; }
      - name: html-validate
        run: npx html-validate index.html hidden-conductor/index.html hidden-conductor/game/index.html
      - name: W3C Nu validator
        run: |
          java -jar node_modules/vnu-jar/build/dist/vnu.jar --errors-only index.html hidden-conductor/index.html hidden-conductor/game/index.html
          java -jar node_modules/vnu-jar/build/dist/vnu.jar --css --errors-only hidden-conductor/style.css hidden-conductor/game/style.css

  links:
    name: Link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --no-progress index.html hidden-conductor/index.html hidden-conductor/game/index.html
          fail: true

  lighthouse:
    name: Lighthouse (mobile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
