name: Cross-browser probe (temporary)
on:
  push:
    branches: [design-polish-xbrowser]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save --no-audit --no-fund playwright@1.63.0
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: (python3 -m http.server 8765 >/dev/null 2>&1 &) && sleep 1
      - name: Probe
        run: |
          for b in chromium firefox webkit; do echo "=== $b"; node .xb/probe.cjs $b http://localhost:8765/ "" | tr -d '\n' | tr -s ' '; echo; done
