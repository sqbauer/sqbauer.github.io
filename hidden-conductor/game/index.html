<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Loop Line</title>
<meta name="description" content="A browser adventure through the cerebellum, built from The Hidden Conductor, a book in progress by Staf Bauer. Walk the hub, ride the lines, collect what the book says.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#101214">
<link rel="canonical" href="https://sqbauer.github.io/hidden-conductor/game/">
<link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<script src="game.js" defer></script>
</head>
<body>
<!-- All text in this file is interface text written for the game. [NOT IN SOURCE]
     Everything taken from the book lives in data/concepts.json and data/world.json. -->
<main id="app">
  <h1 class="sr-only">The Loop Line</h1>

  <div id="stage">
    <canvas id="view" width="640" height="400" role="img" aria-label="First-person view of the zone you are in"></canvas>
    <canvas id="map" width="150" height="150" aria-hidden="true"></canvas>
    <div id="hud">
      <span id="zone-name"></span>
      <span id="progress"></span>
    </div>
    <p id="timer" hidden></p>
    <p id="prompt" role="status"></p>
    <p id="toast" role="status"></p>

    <div id="touch" role="group" aria-label="Movement buttons">
      <button type="button" data-key="left" aria-label="Turn left">&#9664;</button>
      <button type="button" data-key="up" aria-label="Walk forward">&#9650;</button>
      <button type="button" data-key="right" aria-label="Turn right">&#9654;</button>
      <button type="button" data-key="down" aria-label="Walk backward">&#9660;</button>
    </div>
    <button type="button" id="act" aria-label="Act">Act</button>

    <section id="title" class="panel" aria-labelledby="title-h">
      <p class="eyebrow">A companion to <cite>The Hidden Conductor</cite></p>
      <h2 id="title-h">The Loop Line</h2>
      <p id="title-sub" class="lede"></p>
      <div id="title-intro"></div>
      <p id="title-disclaimer" class="small"></p>
      <p id="title-controls" class="small"></p>
      <p class="buttons">
        <button type="button" class="btn" id="start">Start</button>
        <button type="button" class="btn ghost" id="reset" hidden>Start over</button>
      </p>
      <p id="load-error" class="small" hidden>The game data could not be loaded. If you opened this file straight from disk, serve the folder over a local web server instead (see the README).</p>
    </section>

    <section id="dialog" class="panel" role="dialog" aria-modal="true" aria-labelledby="dialog-title" hidden>
      <p id="dialog-kind" class="badge"></p>
      <h2 id="dialog-title">Card</h2>
      <p id="dialog-note" class="small"></p>
      <blockquote id="dialog-text"></blockquote>
      <p id="dialog-source" class="small"></p>
      <p class="buttons"><button type="button" class="btn" id="dialog-next">Continue</button></p>
    </section>

    <section id="mini" class="panel" role="dialog" aria-modal="true" aria-labelledby="mini-title" hidden>
      <h2 id="mini-title">Task</h2>
      <p id="mini-intro"></p>
      <div id="mini-body"></div>
      <p id="mini-status" role="status"></p>
      <p class="buttons">
        <button type="button" class="btn" id="mini-done" hidden>Done</button>
        <button type="button" class="btn ghost" id="mini-leave">Leave</button>
      </p>
    </section>

    <section id="notebook" class="panel" role="dialog" aria-modal="true" aria-labelledby="notebook-h" hidden>
      <h2 id="notebook-h">Notebook</h2>
      <p id="notebook-count" class="small"></p>
      <div id="notebook-list"></div>
      <p class="buttons"><button type="button" class="btn" id="notebook-close">Close</button></p>
    </section>
  </div>

  <nav id="bar" aria-label="Game menu">
    <button type="button" id="btn-notebook">Notebook (N)</button>
    <button type="button" id="btn-map">Map (M)</button>
    <button type="button" id="btn-help">Help</button>
    <a href="../">Back to the companion page</a>
  </nav>
</main>
<noscript><p style="padding:1rem;color:#fff">The Loop Line is a game and needs JavaScript. The companion page one level up can be read without it.</p></noscript>
</body>
</html>
